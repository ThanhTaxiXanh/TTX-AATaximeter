name: ttx_aataximeter
description: TTX AATaximeter - clean-room Flutter/Dart taximeter MVP.
publish_to: none
version: 0.4.0+4

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  geolocator_android: ^5.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
