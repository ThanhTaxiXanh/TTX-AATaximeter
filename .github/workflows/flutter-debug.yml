name: Flutter MVP Debug APK
on:
  push:
    branches: [main, feature/flutter-taximeter-foundation]
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name ttx_aataximeter --org vn.thanhtaxixanh
      - name: Remove auto-generated demo widget test
        run: rm -f test/widget_test.dart
      - name: Inject GPS permissions
        run: python3 tool/bootstrap_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run unit tests
        run: flutter test
      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build DEBUG APK (not Android Auto enabled)
        run: flutter build apk --debug
      - name: Verify APK merged GPS foreground-service manifest
        run: python3 tool/verify_apk_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: ttx-aataximeter-mvp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
